name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Binary (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            bin: slasht
          - os: darwin
            arch: arm64
            runner: macos-latest
            bin: slasht
          - os: darwin
            arch: amd64
            runner: macos-13
            bin: slasht
          - os: windows
            arch: amd64
            runner: windows-latest
            bin: slasht.exe
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Determine Version
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          fi

      - name: Build Binary
        shell: bash
        run: |
          TARGET_DIR="dist/slasht_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}"
          mkdir -p "$TARGET_DIR"
          go build -ldflags="-s -w -X main.Version=${VERSION}" -o "$TARGET_DIR/${{ matrix.bin }}" ./cmd/slasht
          
          if [ "${{ matrix.os }}" = "windows" ]; then
            (cd dist && zip -r "slasht_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}.zip" "slasht_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}")
          else
            tar -czvf "dist/slasht_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz" -C dist "slasht_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: slasht-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          fi

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          draft: false
          prerelease: false
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
